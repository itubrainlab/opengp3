# On a GitHub release (or run by hand): build the package once, install the
# built wheel with all its dependencies on every OS and run the FULL test
# suite against it (including the slow end-to-end, GUI and LSL tests), then
# attach the built files to the release.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Release tag matches the package version
        if: github.event_name == 'release'
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('opengp3/__init__.py').read())[1])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:  # Python 3.9 (EOL) is no longer provided on these runners
          - os: ubuntu-latest
            python: "3.9"
          - os: windows-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4   # for the tests only; the package comes from the wheel
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip                          # reuse downloaded PySide6/OpenCV/... wheels
          cache-dependency-path: pyproject.toml
      - name: System libraries (OpenCV needs libGL, Qt's offscreen platform EGL/xkb/fontconfig)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y libgl1 libusb-1.0-0 libegl1
          libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install the built wheel
        run: pip install "$(ls dist/*.whl)[dev]"
      - name: Tests use the installed package, not the checkout
        run: |
          mv opengp3 _opengp3_source
          python -c "import opengp3, sys; print('testing', opengp3.__version__, 'from', opengp3.__file__)"
      - name: Full test suite
        run: python -m pytest -q --durations=25

  attach:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attach the built package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
