name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:  # Python 3.9 (EOL) is no longer provided on these runners
          - os: ubuntu-latest
            python: "3.9"
          - os: windows-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System libraries (OpenCV needs libGL, Qt's offscreen platform EGL/xkb/fontconfig)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y libgl1 libusb-1.0-0 libegl1
          libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - run: pip install -e ".[dev]"
      - run: python -m pytest -v
