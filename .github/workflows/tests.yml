# Fast checks on every push to main and on pull requests: one OS, one Python,
# unit tests only (no end-to-end, GUI or LSL tests: those run on release, see
# release.yml). Uses OpenCV's headless build and skips the Qt GUI library, so
# no system packages are needed.
name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (without the GUI library)
        run: |
          pip install --no-deps -e .
          pip install pyusb libusb-package numpy opencv-python-headless pylsl pytest
      - run: python -m pytest -q -m "not slow"
